name: Chain Trigger - CV Thismonth

on:
  workflow_run:
    workflows: ["Run Auto CV Script (Today)"]
    types: [completed]

jobs:
  trigger-next:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Trigger sixpack_cv_referral_thismonth
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/shuheikimura66/sixpack_cv_referral_thismonth/actions/workflows/run_cv.yml/dispatches \
            -d '{"ref":"main"}'
